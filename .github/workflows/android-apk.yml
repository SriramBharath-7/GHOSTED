# Checks the app, then builds an installable Android APK (artifact "GHOSTED-apk")
# for every pushed branch, so any branch can be tried on a phone.
# Pushing a tag like v0.1.0 also attaches GHOSTED.apk to a GitHub Release.
# A tag containing "-test" (v0.0.0-test.1) makes a draft release instead, which
# only maintainers can see: a safe way to try the release path.
#
# Signing: without secrets the APK is signed with the standard debug key from
# the Expo template (installable, updates install over each other, not for Play).
# For a real release key, add these repository secrets (README: "Release signing"):
#   ANDROID_KEYSTORE_BASE64    base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD       optional; defaults to the keystore password (PKCS12)
# Never commit the keystore. Switching keys later means uninstalling first (Android
# refuses the update), which erases on-device data: export both backups first.
name: Android APK

# No pull_request trigger: a PR's commits are already built by their branch push.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --ci

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # v5 (MIT) on purpose: v6 makes you accept Gradle's proprietary caching terms.
      - uses: gradle/actions/setup-gradle@v5

      # android/ is generated from app.json + config plugins (never committed).
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Check Android backup privacy rules
        run: npm run check:backup

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Phones (arm64) plus the x86_64 emulator; drop x86_64 to build faster.
          args=(assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # Half-configured secrets must fail, not quietly fall back to the debug key.
            if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS is missing."
              exit 1
            fi
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            # PKCS12 keystores (keytool's default) use the store password for the key too.
            args+=(
              "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore"
              "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            )
            echo "SIGNER=release" >> "$GITHUB_ENV"
            echo "Signing with the release key from repository secrets."
          else
            echo "SIGNER=debug" >> "$GITHUB_ENV"
            echo "::warning::No release keystore secrets: APK is signed with the debug key."
          fi
          ./gradlew "${args[@]}"

      - name: Verify the APK exists and is signed
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -s "$apk" ]; then
            echo "::error::Gradle finished but no APK was produced at $apk"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/GHOSTED.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          certs=$("$tools/apksigner" verify --print-certs dist/GHOSTED.apk)
          echo "$certs"
          if [ "$SIGNER" = release ] && grep -q "CN=Android Debug" <<< "$certs"; then
            echo "::error::Release secrets are set but the APK is signed with the debug key."
            exit 1
          fi
          echo "Signed with the $SIGNER key."
          ls -lh dist/GHOSTED.apk

      - uses: actions/upload-artifact@v7
        with:
          name: GHOSTED-apk
          path: dist/GHOSTED.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: GHOSTED-apk

      - name: Attach GHOSTED.apk to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=()
          if [[ "$GITHUB_REF_NAME" == *-test* ]]; then draft=(--draft); fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" GHOSTED.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" GHOSTED.apk --repo "$GITHUB_REPOSITORY" \
              --title "GHOSTED $GITHUB_REF_NAME" --generate-notes "${draft[@]}"
          fi
