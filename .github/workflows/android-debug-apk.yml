name: GHOSTED - Android Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghosted-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out GHOSTED
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi


      - name: Check Android local-only JS syntax
        run: |
          node --check src/mobile.js
          node --check src/mobile-backup.js
          node --check public/js/ghosted-05.js

      - name: Verify offline recovery and build separation
        run: npm run test:mobile

      - name: Build Android-only offline assets
        run: |
          npm run build:mobile
          test -s dist-mobile/index.html
          test -s dist-mobile/js/ghosted-01.js
          test -s dist-mobile/js/ghosted-03.js
          test -s dist-mobile/css/ghosted-01.css
          test -s dist-mobile/assets/ranks/rank_001.png
          test -s dist-mobile/assets/divisions/division_01.png
          test -s dist-mobile/assets/frames/terminal_frame_01.png
          ! grep -q '/src/main.js' dist-mobile/index.html
          echo 'Offline APK assets verified:'
          du -sh dist-mobile

      - name: Prepare Capacitor Android project
        shell: bash
        run: |
          if [ -f android/gradlew ]; then
            echo 'Using tracked Android project.'
          else
            echo 'Generating Android project from Capacitor configuration.'
            npx cap add android
          fi
          npx cap sync android
          test -s android/app/src/main/assets/public/js/ghosted-03.js
          chmod +x android/gradlew

      - name: Verify the native GHOSTED launcher icon
        shell: bash
        run: |
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/drawable/ghosted_launcher_foreground.png
          grep -q 'ghosted_launcher_foreground' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo 'GHOSTED launcher resources verified in Android project.'

      - name: Restore persistent GHOSTED debug signing key
        shell: bash
        env:
          GHOSTED_DEBUG_KEYSTORE_B64: ${{ secrets.GHOSTED_DEBUG_KEYSTORE_B64 }}
        run: |
          if [[ -z "$GHOSTED_DEBUG_KEYSTORE_B64" ]]; then
            echo 'Missing Actions secret GHOSTED_DEBUG_KEYSTORE_B64'; exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$GHOSTED_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
          echo 'Persistent debug signing keystore restored.'
      - name: Compile installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK signature and show certificate fingerprint
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep 'SHA256:'
      - name: Verify APK exists
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GHOSTED-Android-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
